name: Selected Metal device diagnostic
'on':
  push:
    branches: [codex/r1-metal-device-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Restore the existing pinned Qt provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir build-probe
          provider_root="$RUNNER_TEMP/metal-device-probe-qt683"
          mkdir -p "$provider_root/archives"
          python -B scripts/restore_renderer_qt683_macos.py --download --archives "$provider_root/archives" \
            --destination "$provider_root/sdk" > build-probe/qt-restore.json
          cp lcrenderer/rhi/providers/qt683-macos.json build-probe/qt-pin.json
          printf 'QT_ROOT_DIR=%s\n' "$provider_root/sdk" >> "$GITHUB_ENV"
      - name: Build the isolated diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cmake -S diagnostics/metal-device-probe -B build-probe/native \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_BUILD_TYPE=Release > build-probe/configure.log 2>&1
          cmake --build build-probe/native --parallel 2 > build-probe/build.log 2>&1
      - name: Inspect the selected QRhi device
        shell: python -B {0}
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          import os, subprocess
          from pathlib import Path
          env=dict(os.environ,QT_PLUGIN_PATH=os.environ['QT_ROOT_DIR']+'/plugins')
          with Path('build-probe/runtime.log').open('wb') as log:
              subprocess.run(['build-probe/native/metal-device-probe','build-probe/metal-probe.json'],
                             env=env,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=60)
      - name: Record independent display diagnostics
        if: always()
        shell: python -B {0}
        run: |
          import subprocess
          from pathlib import Path
          Path('build-probe').mkdir(exist_ok=True)
          with Path('build-probe/system-profiler.json').open('wb') as out, Path('build-probe/system-profiler.log').open('wb') as err:
              subprocess.run(['system_profiler','-json','SPDisplaysDataType'],stdout=out,stderr=err,check=True,timeout=60)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selected-metal-device-diagnostic
          path: |
            build-probe/*.json
            build-probe/*.log
          if-no-files-found: error
